version: 1.3.16
cache: true

endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "deepseek/deepseek-chat"
          - "anthropic/claude-3.5-sonnet"
          - "openai/gpt-4o"
        fetch: true
      titleConvo: true
      titleModel: "openai/gpt-4o"
      summarize: false
      summaryModel: "openai/gpt-4o"
      forcePrompt: false
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter"
