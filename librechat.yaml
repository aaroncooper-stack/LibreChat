version: 1.3.15
cache: true


# ============================================================
# SHARED "THOUGHTFUL ADVISER" INSTRUCTIONS
# ============================================================

thoughtful_adviser: &thoughtful_adviser |
  You are my independent, thoughtful adviser.

  Your priority is helping me make well-informed decisions, not pleasing me,
  validating my opinions, or telling me what you think I want to hear.

  - Assess my question, assumptions, and proposed solution on their merits.
    Do not automatically agree with me.
  - If my reasoning is flawed, questionable, incomplete, or based on a weak
    assumption, explain why clearly. Do not disagree merely for the sake of it.
  - Consider reasonable alternatives, including options I have not mentioned.
    Explain important trade-offs, opportunity costs, and practical implications.
  - Be candid about drawbacks, risks, limitations, uncertainty, and situations
    where the evidence is weak or mixed.
  - Actively guard against confirmation bias. Consider credible arguments and
    evidence that could support a different conclusion from my initial view.
  - Prioritize evidence. Distinguish between established facts, sourced claims,
    estimates, assumptions, and your own analysis.
  - For current, changing, expensive, consequential, or fact-sensitive questions,
    use web search when available. Prefer primary and authoritative sources.
    Never invent evidence, sources, citations, prices, specifications, or facts.
  - When I ask what I should do, give me a clear recommendation when the
    evidence supports one. Explain the reasoning, the main alternatives,
    disadvantages, risks, and what information could change the conclusion.
  - Focus on my underlying objective rather than simply accepting the solution
    I initially propose.
  - Ask a clarifying question only when missing information would materially
    change the answer. Otherwise make reasonable assumptions and proceed.
  - Match the amount of analysis to the problem. Be more analytical for
    complex, expensive, risky, or consequential decisions and more direct for
    simple questions.
  - Be direct, thoughtful, practical, and respectful.
  - Avoid flattery, reflexive agreement, generic reassurance, and unnecessary
    disclaimers.
  - If you agree with me, explain why. If you disagree, explain why.


# ============================================================
# MEMORY
# ============================================================

memory:
  disabled: false
  agent:
    enabled: true
    provider: "openrouter"
    model: "deepseek/deepseek-chat"
    maxInputTokens: 4000
    instructions: |
      Store user preferences, technical setups, and important project facts as key/value pairs.
      Keep entries concise and update them when information changes.
    validKeys:
      - "coding_preferences"
      - "project_details"
      - "user_preferences"


# ============================================================
# WEB SEARCH
# ============================================================

webSearch:
  searchProvider: "tavily"
  scraperProvider: "tavily"
  tavilyApiKey: "${TAVILY_API_KEY}"

  tavilySearchOptions:
    searchDepth: "advanced"
    maxResults: 5
    topic: "general"

  tavilyScraperOptions:
    extractDepth: "basic"


# ============================================================
# OPENROUTER
# ============================================================

endpoints:
  custom:

    - name: "openrouter"

      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"

      models:
        default:
          - "openai/gpt-5.6-luna-pro"
          - "openai/gpt-5.6-luna"
          - "deepseek/deepseek-chat"
          - "anthropic/claude-haiku-4.5"
          - "meta-llama/llama-3.3-70b-instruct"
          - "openrouter/free"
        fetch: false

      titleConvo: true
      titleModel: "openai/gpt-5.6-luna"

      summarize: false
      summaryModel: "openai/gpt-5.6-luna"

      forcePrompt: false

      dropParams:
        - "stop"

      modelDisplayLabel: "OpenRouter"

      customParams:
        reasoningFormat: "reasoning_object"


# ============================================================
# MODEL SPECS
# ============================================================

modelSpecs:

  # Keep the normal model selector available.
  enforce: false
  prioritize: true

  list:

    # --------------------------------------------------------
    # DEFAULT — GPT-5.6 LUNA PRO
    # --------------------------------------------------------

    - name: "thoughtful-gpt"
      label: "GPT-5.6 Luna Pro"
      default: true

      preset:
        endpoint: "openrouter"
        model: "openai/gpt-5.6-luna-pro"
        modelLabel: "GPT-5.6 Luna Pro — Thoughtful Adviser"

        # GPT-5.6 reasoning configuration
        reasoning_effort: "high"
        reasoning_mode: "pro"
        reasoning_context: "all_turns"
        reasoning_summary: "concise"
        useResponsesApi: true

        # Shared adviser behaviour
        promptPrefix: *thoughtful_adviser


    # --------------------------------------------------------
    # GPT-5.6 LUNA STANDARD
    # --------------------------------------------------------

    - name: "thoughtful-luna"
      label: "GPT-5.6 Luna"
      
      preset:
        endpoint: "openrouter"
        model: "openai/gpt-5.6-luna"
        modelLabel: "GPT-5.6 Luna — Thoughtful Adviser"

        reasoning_effort: "high"
        reasoning_context: "all_turns"
        reasoning_summary: "concise"
        useResponsesApi: true

        promptPrefix: *thoughtful_adviser


    # --------------------------------------------------------
    # DEEPSEEK
    # --------------------------------------------------------

    - name: "thoughtful-deepseek"
      label: "DeepSeek Chat"

      preset:
        endpoint: "openrouter"
        model: "deepseek/deepseek-chat"
        modelLabel: "DeepSeek Chat — Thoughtful Adviser"

        promptPrefix: *thoughtful_adviser


    # --------------------------------------------------------
    # CLAUDE HAIKU
    # --------------------------------------------------------

    - name: "thoughtful-claude"
      label: "Claude Haiku 4.5"

      preset:
        endpoint: "openrouter"
        model: "anthropic/claude-haiku-4.5"
        modelLabel: "Claude Haiku 4.5 — Thoughtful Adviser"

        promptPrefix: *thoughtful_adviser


    # --------------------------------------------------------
    # LLAMA
    # --------------------------------------------------------

    - name: "thoughtful-llama"
      label: "Llama 3.3 70B"

      preset:
        endpoint: "openrouter"
        model: "meta-llama/llama-3.3-70b-instruct"
        modelLabel: "Llama 3.3 70B — Thoughtful Adviser"

        promptPrefix: *thoughtful_adviser


    # --------------------------------------------------------
    # OPENROUTER FREE
    # --------------------------------------------------------

    - name: "thoughtful-free"
      label: "OpenRouter Free"

      preset:
        endpoint: "openrouter"
        model: "openrouter/free"
        modelLabel: "OpenRouter Free — Thoughtful Adviser"

        promptPrefix: *thoughtful_adviser


# ============================================================
# INTERFACE
# ============================================================

interface:
  modelSelect: true
