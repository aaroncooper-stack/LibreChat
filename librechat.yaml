version: 1.3.16
cache: true

memory:
  disabled: false
  agent:
    enabled: true
    provider: "openrouter"
    model: "deepseek/deepseek-chat"
    maxInputTokens: 4000
    instructions: |
      Store user preferences, technical setups, and important project facts as key/value pairs. Keep entries concise and update them when information changes.
    validKeys:
      - "coding_preferences"
      - "project_details"
      - "user_preferences"


webSearch:
  searchProvider: "tavily"
  scraperProvider: "tavily"
  tavilyApiKey: "${TAVILY_API_KEY}"
  tavilySearchOptions:
    searchDepth: "advanced"
    maxResults: 5
    topic: "general"
  tavilyScraperOptions:
    extractDepth: "basic"


endpoints:
  custom:
    - name: "openrouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "deepseek/deepseek-chat"
          - "openai/gpt-5.6-luna"
          - "anthropic/claude-haiku-4.5"
          - "meta-llama/llama-3.3-70b-instruct"
          - "openrouter/free" # OpenRouter's general free tier auto-router
        fetch: false
      titleConvo: true
      titleModel: "openai/gpt-5.6-luna"
      summarize: false
      summaryModel: "openai/gpt-5.6-luna"
      forcePrompt: false
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter (Best Value)"
